_schema-version: "3.3"
ID: btp-business-partner-sales-orders
description: Fiori Elements List Report (grouping) for Business Partner Sales Orders
version: 1.0.0
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ---------- CAP service (in-memory SQLite for POC) ----------
  - name: btp-bp-sales-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 512M
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: btp-bp-sales-uaa

  # ---------- HTML5 apps content uploader ----------
  - name: btp-bp-sales-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: btp-bp-sales-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - businesspartnersalesorders.zip
          name: businesspartnersalesorders
          target-path: resources/

  # ---------- The UI5 app build ----------
  - name: businesspartnersalesorders
    type: html5
    path: app/businesspartnersalesorders
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []
      build-result: dist

  # ---------- Approuter ----------
  - name: btp-bp-sales-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: btp-bp-sales-uaa
      - name: btp-bp-sales-html5-repo-rt
      - name: btp-bp-sales-destination

resources:
  - name: btp-bp-sales-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: btp-bp-sales-${space}
        tenant-mode: dedicated

  - name: btp-bp-sales-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: btp-bp-sales-html5-repo-rt
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: btp-bp-sales-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
