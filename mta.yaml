_schema-version: "3.3"
ID: btp-business-partner-sales-orders
description: Fiori Elements List Report for Business Partner Sales Orders (slim POC - 200 MB CF MEMORY budget)
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p gen/srv/app/businesspartnersalesorders gen/srv/db/data
        - cp -r app/businesspartnersalesorders/webapp gen/srv/app/businesspartnersalesorders/
        - cp -r db/data/. gen/srv/db/data/

modules:
  # ---------- Single CAP service that also serves the static UI ----------
  # With only 200 MB of CF Runtime MEMORY entitled in the subaccount,
  # we collapse the whole app into one Node.js buildpack module:
  #   * CAP serves the OData V4 service at /sales/
  #   * CAP serves the static Fiori app at /businesspartnersalesorders/webapp/
  #   * Auth is set to "dummy" in package.json so no XSUAA / approuter
  #     are required (anonymous demo). The xs-security.json and the
  #     approuter/ folder remain in the repo for the future HANA path.
  - name: btp-bp-sales-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 192M
      disk-quota: 256M
    build-parameters:
      builder: npm
